<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualCalc Hub - Interactive Calculators & Visualizers</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            900: '#0c4a6e',
                        },
                        accent: {
                            500: '#10b981',
                            600: '#059669',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js for Interactive Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- html2pdf.js for Report Exporting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .ad-placeholder {
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0, rgba(255,255,255,0.03) 10px, transparent 0, transparent 20px);
        }
        .light .ad-placeholder {
            background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.03) 0, rgba(0,0,0,0.03) 10px, transparent 0, transparent 20px);
        }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
        ::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.5); border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col transition-colors duration-200 light:bg-slate-50 light:text-slate-800">

    <!-- Top Leaderboard Ad Unit -->
    <div class="bg-slate-950 light:bg-slate-200 border-b border-slate-800 light:border-slate-300 py-2 px-4 text-center">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
            <span class="text-[10px] uppercase tracking-widest text-slate-500 font-semibold">Advertisement / Sponsored</span>
            <div class="w-full max-w-[728px] h-[60px] sm:h-[90px] bg-slate-900 light:bg-slate-100 border border-dashed border-slate-700 light:border-slate-400 rounded flex items-center justify-between px-4 text-xs text-slate-400 overflow-hidden ad-placeholder">
                <div class="flex items-center space-x-3">
                    <i class="fa-solid fa-rectangle-ad text-brand-500 text-2xl"></i>
                    <div class="text-left">
                        <p class="font-bold text-slate-200 light:text-slate-800">Refinance Your Mortgage at 5.2% APY</p>
                        <p class="hidden sm:block text-slate-400">Lock in lower rates today with zero closing costs. Fast approval!</p>
                    </div>
                </div>
                <a href="#affiliate-disclaimer" onclick="openLegalModal('affiliate')" class="bg-brand-600 hover:bg-brand-500 text-white font-medium px-3 py-1.5 rounded text-xs transition shadow-sm whitespace-nowrap">Check Rate &rarr;</a>
            </div>
            <span class="hidden md:inline-block text-[10px] text-slate-500">Ad Slot #1 (728x90)</span>
        </div>
    </div>

    <!-- Main Navigation Header -->
    <header class="bg-slate-800/80 light:bg-white/90 backdrop-blur-md border-b border-slate-700/60 light:border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-accent-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-brand-500/20">
                    <i class="fa-solid fa-chart-line"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold bg-gradient-to-r from-slate-100 to-slate-400 light:from-slate-900 light:to-slate-600 bg-clip-text text-transparent">VisualCalc<span class="text-brand-500">Hub</span></h1>
                    <p class="text-[11px] text-slate-400 light:text-slate-500 hidden sm:block">Interactive Calculators & Data Visualizers</p>
                </div>
            </div>

            <div class="flex items-center space-x-2 sm:space-x-3">
                <button id="themeToggle" onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-700/50 light:bg-slate-100 text-slate-300 light:text-slate-600 hover:text-white light:hover:text-slate-900 transition" title="Toggle Light/Dark Theme">
                    <i class="fa-solid fa-sun text-amber-400 dark:hidden"></i>
                    <i class="fa-solid fa-moon text-indigo-400 hidden dark:inline"></i>
                </button>
                <button onclick="shareStateModal()" class="px-3 py-2 rounded-lg bg-slate-700/50 light:bg-slate-100 text-xs font-semibold text-slate-200 light:text-slate-700 hover:bg-slate-700 light:hover:bg-slate-200 transition flex items-center space-x-1.5">
                    <i class="fa-solid fa-share-nodes text-brand-500"></i>
                    <span class="hidden sm:inline">Share Calculation</span>
                </button>
                <button onclick="exportPDF()" class="px-3 py-2 rounded-lg bg-brand-600 hover:bg-brand-500 text-white text-xs font-semibold transition flex items-center space-x-1.5 shadow-md shadow-brand-600/30">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>Export PDF</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Tab Navigation Banner -->
    <div class="bg-slate-800 light:bg-slate-100 border-b border-slate-700 light:border-slate-200 overflow-x-auto scrollbar-none">
        <div class="max-w-7xl mx-auto px-4 flex space-x-2 min-w-max py-2">
            <button onclick="switchTab('mortgage')" id="tab-mortgage" class="tab-btn px-4 py-2.5 rounded-lg text-xs font-semibold flex items-center space-x-2 transition bg-brand-600 text-white shadow-md">
                <i class="fa-solid fa-house-chimney"></i>
                <span>1. Rent vs Buy</span>
            </button>
            <button onclick="switchTab('compound')" id="tab-compound" class="tab-btn px-4 py-2.5 rounded-lg text-xs font-semibold flex items-center space-x-2 transition text-slate-400 hover:text-white light:text-slate-600 hover:bg-slate-700/40">
                <i class="fa-solid fa-piggy-bank"></i>
                <span>2. Compound Growth</span>
            </button>
            <button onclick="switchTab('loan')" id="tab-loan" class="tab-btn px-4 py-2.5 rounded-lg text-xs font-semibold flex items-center space-x-2 transition text-slate-400 hover:text-white light:text-slate-600 hover:bg-slate-700/40">
                <i class="fa-solid fa-calculator"></i>
                <span>3. Loan EMI Payoff</span>
            </button>
            <button onclick="switchTab('fitness')" id="tab-fitness" class="tab-btn px-4 py-2.5 rounded-lg text-xs font-semibold flex items-center space-x-2 transition text-slate-400 hover:text-white light:text-slate-600 hover:bg-slate-700/40">
                <i class="fa-solid fa-fire-flame-curved"></i>
                <span>4. Fitness & Macros</span>
            </button>
            <button onclick="switchTab('graphing')" id="tab-graphing" class="tab-btn px-4 py-2.5 rounded-lg text-xs font-semibold flex items-center space-x-2 transition text-slate-400 hover:text-white light:text-slate-600 hover:bg-slate-700/40">
                <i class="fa-solid fa-chart-area"></i>
                <span>5. Function Grapher</span>
            </button>
            <button onclick="switchTab('sleep')" id="tab-sleep" class="tab-btn px-4 py-2.5 rounded-lg text-xs font-semibold flex items-center space-x-2 transition text-slate-400 hover:text-white light:text-slate-600 hover:bg-slate-700/40">
                <i class="fa-solid fa-bed"></i>
                <span>6. Sleep Calculator</span>
            </button>
        </div>
    </div>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6" id="reportable-content">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

            <!-- Primary Workspace (9 Cols) -->
            <div class="lg:col-span-9 space-y-6">

                <!-- 1. RENT VS BUY CALCULATOR -->
                <section id="calc-mortgage" class="calc-panel block bg-slate-800/60 light:bg-white border border-slate-700
