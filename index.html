<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinCalc Suite - Multi-Mode Calculator & Converter</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        win: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            600: '#0284c7',
                            700: '#0369a1',
                            900: '#0f172a',
                            dark: '#1e293b'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .calc-btn {
            background-color: rgba(255, 255, 255, 0.05);
            transition: all 0.1s ease;
        }
        .calc-btn:hover { background-color: rgba(255, 255, 255, 0.12); }
        .calc-btn:active { transform: scale(0.97); }
        .light .calc-btn { background-color: #e2e8f0; }
        .light .calc-btn:hover { background-color: #cbd5e1; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col light:bg-slate-100 light:text-slate-800">

    <!-- Top App Titlebar -->
    <header class="bg-slate-900 light:bg-white border-b border-slate-800 light:border-slate-300 h-12 flex items-center justify-between px-4 sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <button onclick="toggleSidebar()" class="p-2 rounded hover:bg-slate-800 light:hover:bg-slate-200 text-slate-300 light:text-slate-700" title="Toggle Menu">
                <i class="fa-solid fa-bars"></i>
            </button>
            <span id="current-mode-title" class="font-semibold text-sm">Standard</span>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleTheme()" class="p-2 rounded hover:bg-slate-800 light:hover:bg-slate-200 text-slate-300 light:text-slate-700 text-xs">
                <i class="fa-solid fa-circle-half-stroke"></i>
            </button>
        </div>
    </header>

    <div class="flex flex-grow relative overflow-hidden">
        
        <!-- Sidebar Navigation Drawer -->
        <aside id="sidebar" class="absolute inset-y-0 left-0 w-64 bg-slate-900 light:bg-white border-r border-slate-800 light:border-slate-300 transform -translate-x-full transition-transform duration-200 z-40 flex flex-col py-3 space-y-1">
            <div class="px-4 py-2 text-[10px] uppercase tracking-wider text-slate-500 font-bold">Calculator Modes</div>
            <button onclick="switchMode('standard')" class="sidebar-btn flex items-center space-x-3 px-4 py-2.5 text-xs font-medium hover:bg-slate-800 light:hover:bg-slate-100 w-full text-left bg-slate-800/60 light:bg-slate-200">
                <i class="fa-solid fa-calculator w-5 text-win-600"></i><span>Standard</span>
            </button>
            <button onclick="switchMode('scientific')" class="sidebar-btn flex items-center space-x-3 px-4 py-2.5 text-xs font-medium hover:bg-slate-800 light:hover:bg-slate-100 w-full text-left">
                <i class="fa-solid fa-flask w-5 text-purple-400"></i><span>Scientific</span>
            </button>
            <button onclick="switchMode('graphing')" class="sidebar-btn flex items-center space-x-3 px-4 py-2.5 text-xs font-medium hover:bg-slate-800 light:hover:bg-slate-100 w-full text-left">
                <i class="fa-solid fa-chart-line w-5 text-emerald-400"></i><span>Graphing</span>
            </button>
            <button onclick="switchMode('programmer')" class="sidebar-btn flex items-center space-x-3 px-4 py-2.5 text-xs font-medium hover:bg-slate-800 light:hover:bg-slate-100 w-full text-left">
                <i class="fa-solid fa-code w-5 text-amber-400"></i><span>Programmer</span>
            </button>
            <button onclick="switchMode('date')" class="sidebar-btn flex items-center space-x-3 px-4 py-2.5 text-xs font-medium hover:bg-slate-800 light:hover:bg-slate-100 w-full text-left">
                <i class="fa-solid fa-calendar-days w-5 text-blue-400"></i><span>Date Calculation</span>
            </button>

            <div class="px-4 py-2 text-[10px] uppercase tracking-wider text-slate-500 font-bold mt-2">Converters</div>
            <button onclick="switchMode('converter', 'currency')" class="sidebar-btn flex items-center space-x-3 px-4 py-2 text-xs font-medium hover:bg-slate-800 light:hover:bg-slate-100 w-full text-left">
                <i class="fa-solid fa-money-bill-wave w-5 text-emerald-500"></i><span>Currency</span>
            </button>
            <button onclick="switchMode('converter', 'volume')" class="sidebar-btn flex items-center space-x-3 px-4 py-2 text-xs font-medium hover:bg-slate-800 light:hover:bg-slate-100 w-full text-left">
                <i class="fa-solid fa-cube w-5 text-cyan-400"></i><span>Volume</span>
            </button>
            <button onclick="switchMode('converter', 'length')" class="sidebar-btn flex items-center space-x-3 px-4 py-2 text-xs font-medium hover:bg-slate-800 light:hover:bg-slate-100 w-full text-left">
                <i class="fa-solid fa-ruler w-5 text-indigo-400"></i><span>Length</span>
            </button>
            <button onclick="switchMode('converter', 'weight')" class="sidebar-btn flex items-center space-x-3 px-4 py-2 text-xs font-medium hover:bg-slate-800 light:hover:bg-slate-100 w-full text-left">
                <i class="fa-solid fa-weight-scale w-5 text-rose-400"></i><span>Weight & Mass</span>
            </button>
            <button onclick="switchMode('converter', 'temperature')" class="sidebar-btn flex items-center space-x-3 px-4 py-2 text-xs font-medium hover:bg-slate-800 light:hover:bg-slate-100 w-full text-left">
                <i class="fa-solid fa-temperature-high w-5 text-amber-500"></i><span>Temperature</span>
            </button>
            <button onclick="switchMode('converter', 'speed')" class="sidebar-btn flex items-center space-x-3 px-4 py-2 text-xs font-medium hover:bg-slate-800 light:hover:bg-slate-100 w-full text-left">
                <i class="fa-solid fa-gauge-high w-5 text-orange-400"></i><span>Speed & Time</span>
            </button>
            <button onclick="switchMode('converter', 'data')" class="sidebar-btn flex items-center space-x-3 px-4 py-2 text-xs font-medium hover:bg-slate-800 light:hover:bg-slate-100 w-full text-left">
                <i class="fa-solid fa-hard-drive w-5 text-teal-400"></i><span>Data</span>
            </button>
            <button onclick="switchMode('converter', 'power')" class="sidebar-btn flex items-center space-x-3 px-4 py-2 text-xs font-medium hover:bg-slate-800 light:hover:bg-slate-100 w-full text-left">
                <i class="fa-solid fa-bolt w-5 text-yellow-400"></i><span>Power & Energy</span>
            </button>
            <button onclick="switchMode('converter', 'pressure')" class="sidebar-btn flex items-center space-x-3 px-4 py-2 text-xs font-medium hover:bg-slate-800 light:hover:bg-slate-100 w-full text-left">
                <i class="fa-solid fa-gauge w-5 text-purple-400"></i><span>Pressure & Area</span>
            </button>
        </aside>

        <!-- Main Workspace Viewport -->
        <main class="flex-grow flex flex-col items-center justify-center p-4">

            <!-- 1. STANDARD CALCULATOR -->
            <div id="view-standard" class="calc-view w-full max-w-sm space-y-3">
                <div class="bg-slate-900 light:bg-white p-4 rounded-xl border border-slate-800 light:border-slate-300 text-right">
                    <div id="std-history" class="text-xs text-slate-500 h-4 font-mono"></div>
                    <div id="std-display" class="text-3xl font-bold font-mono tracking-wider overflow-x-auto">0</div>
                </div>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="stdInput('C')" class="calc-btn p-3 rounded-lg text-xs font-semibold text-rose-400">C</button>
                    <button onclick="stdInput('CE')" class="calc-btn p-3 rounded-lg text-xs font-semibold text-rose-400">CE</button>
                    <button onclick="stdInput('del')" class="calc-btn p-3 rounded-lg text-xs font-semibold"><i class="fa-solid fa-delete-left"></i></button>
                    <button onclick="stdInput('/')" class="calc-btn p-3 rounded-lg text-xs font-semibold text-win-600">&divide;</button>
                    
                    <button onclick="stdInput('7')" class="calc-btn p-3 rounded-lg text-sm font-semibold">7</button>
                    <button onclick="stdInput('8')" class="calc-btn p-3 rounded-lg text-sm font-semibold">8</button>
                    <button onclick="stdInput('9')" class="calc-btn p-3 rounded-lg text-sm font-semibold">9</button>
                    <button onclick="stdInput('*')" class="calc-btn p-3 rounded-lg text-xs font-semibold text-win-600">&times;</button>
                    
                    <button onclick="stdInput('4')" class="calc-btn p-3 rounded-lg text-sm font-semibold">4</button>
                    <button onclick="stdInput('5')" class="calc-btn p-3 rounded-lg text-sm font-semibold">5</button>
                    <button onclick="stdInput('6')" class="calc-btn p-3 rounded-lg text-sm font-semibold">6</button>
                    <button onclick="stdInput('-')" class="calc-btn p-3 rounded-lg text-xs font-semibold text-win-600">-</button>
                    
                    <button onclick="stdInput('1')" class="calc-btn p-3 rounded-lg text-sm font-semibold">1</button>
                    <button onclick="stdInput('2')" class="calc-btn p-3 rounded-lg text-sm font-semibold">2</button>
                    <button onclick="stdInput('3')" class="calc-btn p-3 rounded-lg text-sm font-semibold">3</button>
                    <button onclick="stdInput('+')" class="calc-btn p-3 rounded-lg text-xs font-semibold text-win-600">+</button>
                    
                    <button onclick="stdInput('+/-')" class="calc-btn p-3 rounded-lg text-sm font-semibold">+/-</button>
                    <button onclick="stdInput('0')" class="calc-btn p-3 rounded-lg text-sm font-semibold">0</button>
                    <button onclick="stdInput('.')" class="calc-btn p-3 rounded-lg text-sm font-semibold">.</button>
                    <button onclick="stdInput('=')" class="calc-btn p-3 rounded-lg text-xs font-semibold bg-win-600 text-white">=</button>
                </div>
            </div>

            <!-- 2. SCIENTIFIC CALCULATOR -->
            <div id="view-scientific" class="calc-view hidden w-full max-w-md space-y-3">
                <div class="bg-slate-900 light:bg-white p-4 rounded-xl border border-slate-800 light:border-slate-300 text-right">
                    <div id="sci-history" class="text-xs text-slate-500 h-4 font-mono"></div>
                    <div id="sci-display" class="text-3xl font-bold font-mono tracking-wider overflow-x-auto">0</div>
                </div>
                <div class="grid grid-cols-5 gap-2">
                    <button onclick="sciInput('sin')" class="calc-btn p-2 rounded-lg text-xs font-semibold text-purple-400">sin</button>
                    <button onclick="sciInput('cos')" class="calc-btn p-2 rounded-lg text-xs font-semibold text-purple-400">cos</button>
                    <button onclick="sciInput('tan')" class="calc-btn p-2 rounded-lg text-xs font-semibold text-purple-400">tan</button>
                    <button onclick="sciInput('C')" class="calc-btn p-2 rounded-lg text-xs font-semibold text-rose-400">C</button>
                    <button onclick="sciInput('del')" class="calc-btn p-2 rounded-lg text-xs font-semibold"><i class="fa-solid fa-delete-left"></i></button>

                    <button onclick="sciInput('sqrt')" class="calc-btn p-2 rounded-lg text-xs font-semibold">&radic;</button>
                    <button onclick="sciInput('pow')" class="calc-btn p-2 rounded-lg text-xs font-semibold">x&94;</button>
                    <button onclick="sciInput('pi')" class="calc-btn p-2 rounded-lg text-xs font-semibold">&pi;</button>
                    <button onclick="sciInput('e')" class="calc-btn p-2 rounded-lg text-xs font-semibold">e</button>
                    <button onclick="sciInput('/')" class="calc-btn p-2 rounded-lg text-xs font-semibold text-win-600">&divide;</button>

                    <button onclick="sciInput('7')" class="calc-btn p-2 rounded-lg text-sm font-semibold">7</button>
                    <button onclick="sciInput('8')" class="calc-btn p-2 rounded-lg text-sm font-semibold">8</button>
                    <button onclick="sciInput('9')" class="calc-btn p-2 rounded-lg text-sm font-semibold">9</button>
                    <button onclick="sciInput('(')" class="calc-btn p-2 rounded-lg text-sm font-semibold">(</button>
                    <button onclick="sciInput('*')" class="calc-btn p-2 rounded-lg text-xs font-semibold text-win-600">&times;</button>

                    <button onclick="sciInput('4')" class="calc-btn p-2 rounded-lg text-sm font-semibold">4</button>
                    <button onclick="sciInput('5')" class="calc-btn p-2 rounded-lg text-sm font-semibold">5</button>
                    <button onclick="sciInput('6')" class="calc-btn p-2 rounded-lg text-sm font-semibold">6</button>
                    <button onclick="sciInput(')')" class="calc-btn p-2 rounded-lg text-sm font-semibold">)</button>
                    <button onclick="sciInput('-')" class="calc-btn p-2 rounded-lg text-xs font-semibold text-win-600">-</button>

                    <button onclick="sciInput('1')" class="calc-btn p-2 rounded-lg text-sm font-semibold">1</button>
                    <button onclick="sciInput('2')" class="calc-btn p-2 rounded-lg text-sm font-semibold">2</button>
                    <button onclick="sciInput('3')" class="calc-btn p-2 rounded-lg text-sm font-semibold">3</button>
                    <button onclick="sciInput('0')" class="calc-btn p-2 rounded-lg text-sm font-semibold col-span-2">0</button>
                    <button onclick="sciInput('+')" class="calc-btn p-2 rounded-lg text-xs font-semibold text-win-600">+</button>
                    <button onclick="sciInput('=')" class="calc-btn p-2 rounded-lg text-xs font-semibold bg-win-600 text-white col-span-5">=</button>
                </div>
            </div>

            <!-- 3. GRAPHING CALCULATOR -->
            <div id="view-graphing" class="calc-view hidden w-full max-w-xl space-y-3">
                <div class="flex space-x-2">
                    <span class="p-2 bg-slate-900 border border-slate-700 rounded text-xs font-mono">f(x)=</span>
                    <input type="text" id="g-input" value="Math.sin(x) * x" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-1.5 text-sm font-mono text-emerald-400 focus:outline-none" oninput="renderGraph()">
                </div>
                <div class="bg-slate-950 p-2 rounded-xl border border-slate-800">
                    <canvas id="winGraphCanvas" class="w-full h-[300px] cursor-crosshair"></canvas>
                </div>
            </div>

            <!-- 4. PROGRAMMER CALCULATOR -->
            <div id="view-programmer" class="calc-view hidden w-full max-w-md space-y-3 font-mono text-xs">
                <div class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-2">
                    <div class="flex justify-between"><span class="text-slate-500">HEX</span><span id="p-hex" class="font-bold text-amber-400">0</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">DEC</span><span id="p-dec" class="font-bold text-win-600">0</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">OCT</span><span id="p-oct" class="font-bold text-cyan-400">0</span></div>
                    <div class="flex justify-between"><span class="text-slate-500">BIN</span><span id="p-bin" class="font-bold text-purple-400">0</span></div>
                </div>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="progInput('7')" class="calc-btn p-3 rounded">7</button>
                    <button onclick="progInput('8')" class="calc-btn p-3 rounded">8</button>
                    <button onclick="progInput('9')" class="calc-btn p-3 rounded">9</button>
                    <button onclick="progInput('C')" class="calc-btn p-3 rounded text-rose-400">C</button>
                    <button onclick="progInput('4')" class="calc-btn p-3 rounded">4</button>
                    <button onclick="progInput('5')" class="calc-btn p-3 rounded">5</button>
                    <button onclick="progInput('6')" class="calc-btn p-3 rounded">6</button>
                    <button onclick="progInput('del')" class="calc-btn p-3 rounded"><i class="fa-solid fa-delete-left"></i></button>
                    <button onclick="progInput('1')" class="calc-btn p-3 rounded">1</button>
                    <button onclick="progInput('2')" class="calc-btn p-3 rounded">2</button>
                    <button onclick="progInput('3')" class="calc-btn p-3 rounded">3</button>
                    <button onclick="progInput('0')" class="calc-btn p-3 rounded col-span-2">0</button>
                </div>
            </div>

            <!-- 5. DATE CALCULATION -->
            <div id="view-date" class="calc-view hidden w-full max-w-md space-y-4 bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <h3 class="font-bold text-sm text-slate-300">Difference between dates</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-1">From</label>
                        <input type="date" id="d-from" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-xs" oninput="calculateDate()">
                    </div>
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-1">To</label>
                        <input type="date" id="d-to" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-xs" oninput="calculateDate()">
                    </div>
                </div>
                <div id="d-result" class="p-3 bg-slate-950 rounded border border-slate-800 text-sm font-semibold text-win-600">
                    Select dates to compute difference.
                </div>
            </div>

            <!-- 6. UNIVERSAL UNIT & CURRENCY CONVERTER -->
            <div id="view-converter" class="calc-view hidden w-full max-w-md space-y-4 bg-slate-900 p-6 rounded-2xl border border-slate-800">
                <h3 id="conv-heading" class="font-bold text-sm text-slate-300 uppercase">Converter</h3>
                <div class="space-y-3">
                    <div>
                        <label class="block text-[10px] text-slate-500 mb-1">Value</label>
                        <input type="number" id="conv-val" value="1" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-sm" oninput="runConversion()">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[10px] text-slate-500 mb-1">From</label>
                            <select id="conv-from" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-xs" onchange="runConversion()"></select>
                        </div>
                        <div>
                            <label class="block text-[10px] text-slate-500 mb-1">To</label>
                            <select id="conv-to" class="w-full bg-slate-800 border border-slate-700 rounded p-2 text-xs" onchange="runConversion()"></select>
                        </div>
                    </div>
                    <div id="conv-output" class="p-4 bg-slate-950 rounded border border-slate-800 text-lg font-mono font-bold text-emerald-400 text-center">
                        0
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        let currentMode = 'standard';
        let subConverterType = '';

        function toggleSidebar() {
            const sb = document.getElementById('sidebar');
            sb.classList.toggle('-translate-x-full');
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            document.documentElement.classList.toggle('light');
        }

        function switchMode(mode, sub = '') {
            currentMode = mode;
            subConverterType = sub;
            document.querySelectorAll('.calc-view').forEach(v => v.classList.add('hidden'));
            
            if (mode === 'converter') {
                document.getElementById('view-converter').classList.remove('hidden');
                document.getElementById('current-mode-title').innerText = `${sub.toUpperCase()} CONVERTER`;
                initConverter(sub);
            } else {
                document.getElementById(`view-${mode}`).classList.remove('hidden');
                document.getElementById('current-mode-title').innerText = mode.charAt(0).toUpperCase() + mode.slice(1);
                if (mode === 'graphing') renderGraph();
            }
            toggleSidebar();
        }

        // Standard Calculator Logic
        let stdExpr = '';
        function stdInput(val) {
            const display = document.getElementById('std-display');
            if (val === 'C') { stdExpr = ''; display.innerText = '0'; }
            else if (val === 'CE') { stdExpr = ''; display.innerText = '0'; }
            else if (val === 'del') { stdExpr = stdExpr.slice(0, -1); display.innerText = stdExpr || '0'; }
            else if (val === '=') {
                try {
                    let res = eval(stdExpr.replace(/×/g, '*').replace(/÷/g, '/'));
                    document.getElementById('std-history').innerText = stdExpr + ' =';
                    display.innerText = res;
                    stdExpr = res.toString();
                } catch(e) { display.innerText = 'Error'; }
            } else {
                stdExpr += val;
                display.innerText = stdExpr;
            }
        }

        // Scientific Calculator Logic
        let sciExpr = '';
        function sciInput(val) {
            const display = document.getElementById('sci-display');
            if (val === 'C') { sciExpr = ''; display.innerText = '0'; }
            else if (val === 'del') { sciExpr = sciExpr.slice(0, -1); display.innerText = sciExpr || '0'; }
            else if (val === 'sin') { sciExpr += 'Math.sin('; }
            else if (val === 'cos') { sciExpr += 'Math.cos('; }
            else if (val === 'tan') { sciExpr += 'Math.tan('; }
            else if (val === 'sqrt') { sciExpr += 'Math.sqrt('; }
            else if (val === 'pi') { sciExpr += 'Math.PI'; }
            else if (val === 'e') { sciExpr += 'Math.E'; }
            else if (val === '=') {
                try {
                    let res = eval(sciExpr);
                    document.getElementById('sci-history').innerText = sciExpr + ' =';
                    display.innerText = res;
                    sciExpr = res.toString();
                } catch(e) { display.innerText = 'Error'; }
            } else {
                sciExpr += val;
                display.innerText = sciExpr;
            }
        }

        // Graphing Engine
        function renderGraph() {
            const canvas = document.getElementById('winGraphCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = 300;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#334155';
            ctx.beginPath();
            ctx.moveTo(0, 150); ctx.lineTo(canvas.width, 150);
            ctx.moveTo(canvas.width / 2, 0); ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            ctx.strokeStyle = '#10b981';
            ctx.lineWidth = 2;
            ctx.beginPath();
            const funcStr = document.getElementById('g-input').value;

            for (let px = 0; px < canvas.width; px++) {
                let x = (px - canvas.width / 2) / 20;
                try {
                    let y = Function('x', `return ${funcStr};`)(x);
                    let py = 150 - (y * 20);
                    if (px === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                } catch(e) {}
            }
            ctx.stroke();
        }

        // Programmer Mode
        let progVal = 0;
        function progInput(val) {
            if (val === 'C') progVal = 0;
            else if (val === 'del') progVal = Math.floor(progVal / 10);
            else {
                progVal = parseInt(progVal.toString() + val) || 0;
            }
            document.getElementById('p-dec').innerText = progVal;
            document.getElementById('p-hex').innerText = progVal.toString(16).toUpperCase();
            document.getElementById('p-oct').innerText = progVal.toString(8);
            document.getElementById('p-bin').innerText = progVal.toString(2);
        }

        // Date Calculation
        function calculateDate() {
            const from = new Date(document.getElementById('d-from').value);
            const to = new Date(document.getElementById('d-to').value);
            if (isNaN(from) || isNaN(to)) return;
            const diffTime = Math.abs(to - from);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            document.getElementById('d-result').innerText = `Difference: ${diffDays} days (~${(diffDays/365).toFixed(1)} years)`;
        }

        // Unit & Currency Converters
        const unitUnits = {
            currency: { USD: 1, EUR: 0.92, GBP: 0.78, JPY: 150, CAD: 1.35 },
            volume: { Liters: 1, Milliliters: 0.001, Gallons: 3.785, Cups: 0.24 },
            length: { Meters: 1, Kilometers: 1000, Miles: 1609.34, Feet: 0.3048, Inches: 0.0254 },
            weight: { Kilograms: 1, Grams: 0.001, Pounds: 0.4535, Ounces: 0.0283 },
            temperature: { Celsius: 'C', Fahrenheit: 'F', Kelvin: 'K' },
            speed: { 'm/s': 1, 'km/h': 0.277, 'mph': 0.447 },
            data: { Bytes: 1, KB: 1024, MB: 1048576, GB: 1073741824 },
            power: { Watts: 1, Kilowatts: 1000, Horsepower: 745.7 },
            pressure: { Pascals: 1, Bar: 100000, PSI: 6894.76 },
            area: { 'm²': 1, 'km²': 1000000, 'sq ft': 0.0929 }
        };

        function initConverter(type) {
            const cat = unitUnits[type] ? unitUnits[type] : unitUnits.length;
            const keys = Object.keys(cat);
            const fromSel = document.getElementById('conv-from');
            const toSel = document.getElementById('conv-to');
            fromSel.innerHTML = ''; toSel.innerHTML = '';
            keys.forEach(k => {
                fromSel.appendChild(new Option(k, k));
                toSel.appendChild(new Option(k, k));
            });
            if (keys.length > 1) toSel.selectedIndex = 1;
            runConversion();
        }

        function runConversion() {
            const val = parseFloat(document.getElementById('conv-val').value) || 0;
            const from = document.getElementById('conv-from').value;
            const to = document.getElementById('conv-to').value;
            const cat = unitUnits[subConverterType];
            if (!cat) return;

            let result = 0;
            if (subConverterType === 'temperature') {
                // Temp special handling
                let celsius = val;
                if (from === 'F') celsius = (val - 32) * 5/9;
                if (from === 'K') celsius = val - 273.15;
                
                if (to === 'C') result = celsius;
                else if (to === 'F') result = (celsius * 9/5) + 32;
                else if (to === 'K') result = celsius + 273.15;
            } else {
                let baseVal = val * cat[from];
                result = baseVal / cat[to];
            }
            document.getElementById('conv-output').innerText = result.toFixed(4);
        }
    </script>
</body>
</html>
