<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusCalc - Advanced Scientific Calculator & Unit Hub</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        nexus: {
                            bg: '#090d16',
                            card: '#111827',
                            border: '#1f293d',
                            accent: '#6366f1',
                            glow: '#818cf8',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;550;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16; color: #f3f4f6; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(99, 102, 241, 0.15); }
        .btn-nexus { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); transition: all 0.15s ease; }
        .btn-nexus:hover { background: rgba(99, 102, 241, 0.2); border-color: rgba(99, 102, 241, 0.4); transform: translateY(-1px); }
        .btn-nexus:active { transform: translateY(0); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6">

    <!-- Header Branding -->
    <header class="w-full max-w-4xl flex items-center justify-between mb-4 px-2">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-atom"></i>
            </div>
            <h1 class="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-indigo-200 to-indigo-400 bg-clip-text text-transparent">NEXUS<span class="text-indigo-500">CALC</span></h1>
        </div>
        <div class="flex items-center space-x-1 bg-slate-900/80 border border-slate-800 p-1 rounded-xl">
            <button onclick="switchCategory('calc')" id="cat-calc" class="px-3 py-1.5 rounded-lg text-xs font-bold transition bg-indigo-600 text-white shadow-md">Calculators</button>
            <button onclick="switchCategory('conv')" id="cat-conv" class="px-3 py-1.5 rounded-lg text-xs font-bold transition text-slate-400 hover:text-white">Converters</button>
        </div>
    </header>

    <!-- Main Dynamic Container -->
    <main class="w-full max-w-4xl glass rounded-3xl p-5 sm:p-8 shadow-2xl flex flex-col md:flex-row gap-6">

        <!-- Mode Sub-Navigation Drawer -->
        <div class="w-full md:w-56 flex md:flex-col gap-1.5 overflow-x-auto pb-2 md:pb-0 border-b md:border-b-0 md:border-r border-slate-800/80 pr-0 md:pr-4">
            <div id="nav-calculators" class="flex md:flex-col gap-1.5 w-full">
                <button onclick="switchMode('standard')" id="mode-standard" class="mode-btn w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold transition flex items-center space-x-2.5 bg-indigo-600/20 text-indigo-400 border border-indigo-500/30">
                    <i class="fa-solid fa-calculator w-4"></i><span>Standard</span>
                </button>
                <button onclick="switchMode('scientific')" id="mode-scientific" class="mode-btn w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold transition flex items-center space-x-2.5 text-slate-400 hover:bg-slate-800/50">
                    <i class="fa-solid fa-flask w-4"></i><span>Scientific</span>
                </button>
                <button onclick="switchMode('graphing')" id="mode-graphing" class="mode-btn w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold transition flex items-center space-x-2.5 text-slate-400 hover:bg-slate-800/50">
                    <i class="fa-solid fa-chart-line w-4"></i><span>Grapher</span>
                </button>
                <button onclick="switchMode('programmer')" id="mode-programmer" class="mode-btn w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold transition flex items-center space-x-2.5 text-slate-400 hover:bg-slate-800/50">
                    <i class="fa-solid fa-code w-4"></i><span>Programmer</span>
                </button>
                <button onclick="switchMode('date')" id="mode-date" class="mode-btn w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold transition flex items-center space-x-2.5 text-slate-400 hover:bg-slate-800/50">
                    <i class="fa-solid fa-calendar w-4"></i><span>Date Calc</span>
                </button>
            </div>
            <div id="nav-converters" class="hidden flex md:flex-col gap-1.5 w-full">
                <button onclick="switchConverter('currency')" id="conv-currency" class="conv-btn w-full text-left px-3.5 py-2 rounded-xl text-xs font-semibold transition text-slate-400 hover:bg-slate-800/50 flex items-center space-x-2"><i class="fa-solid fa-money-bill-wave w-4 text-emerald-400"></i><span>Currency</span></button>
                <button onclick="switchConverter('length')" id="conv-length" class="conv-btn w-full text-left px-3.5 py-2 rounded-xl text-xs font-semibold transition text-slate-400 hover:bg-slate-800/50 flex items-center space-x-2"><i class="fa-solid fa-ruler w-4 text-indigo-400"></i><span>Length</span></button>
                <button onclick="switchConverter('weight')" id="conv-weight" class="conv-btn w-full text-left px-3.5 py-2 rounded-xl text-xs font-semibold transition text-slate-400 hover:bg-slate-800/50 flex items-center space-x-2"><i class="fa-solid fa-weight-scale w-4 text-rose-400"></i><span>Weight & Mass</span></button>
                <button onclick="switchConverter('volume')" id="conv-volume" class="conv-btn w-full text-left px-3.5 py-2 rounded-xl text-xs font-semibold transition text-slate-400 hover:bg-slate-800/50 flex items-center space-x-2"><i class="fa-solid fa-cube w-4 text-cyan-400"></i><span>Volume</span></button>
                <button onclick="switchConverter('temperature')" id="conv-temperature" class="conv-btn w-full text-left px-3.5 py-2 rounded-xl text-xs font-semibold transition text-slate-400 hover:bg-slate-800/50 flex items-center space-x-2"><i class="fa-solid fa-temperature-high w-4 text-amber-400"></i><span>Temperature</span></button>
                <button onclick="switchConverter('energy')" id="conv-energy" class="conv-btn w-full text-left px-3.5 py-2 rounded-xl text-xs font-semibold transition text-slate-400 hover:bg-slate-800/50 flex items-center space-x-2"><i class="fa-solid fa-bolt w-4 text-yellow-400"></i><span>Energy & Power</span></button>
                <button onclick="switchConverter('speed')" id="conv-speed" class="conv-btn w-full text-left px-3.5 py-2 rounded-xl text-xs font-semibold transition text-slate-400 hover:bg-slate-800/50 flex items-center space-x-2"><i class="fa-solid fa-gauge-high w-4 text-orange-400"></i><span>Speed & Time</span></button>
                <button onclick="switchConverter('area')" id="conv-area" class="conv-btn w-full text-left px-3.5 py-2 rounded-xl text-xs font-semibold transition text-slate-400 hover:bg-slate-800/50 flex items-center space-x-2"><i class="fa-solid fa-draw-polygon w-4 text-purple-400"></i><span>Area & Pressure</span></button>
                <button onclick="switchConverter('data')" id="conv-data" class="conv-btn w-full text-left px-3.5 py-2 rounded-xl text-xs font-semibold transition text-slate-400 hover:bg-slate-800/50 flex items-center space-x-2"><i class="fa-solid fa-hard-drive w-4 text-teal-400"></i><span>Data & Angle</span></button>
            </div>
        </div>

        <!-- Interactive Workspace Area -->
        <div class="flex-grow flex flex-col justify-between">

            <!-- STANDARD VIEW -->
            <div id="view-standard" class="calc-space space-y-4">
                <div class="bg-slate-950/80 p-4 rounded-2xl border border-slate-800 text-right">
                    <div id="std-history" class="text-xs text-slate-500 mono h-4"></div>
                    <div id="std-display" class="text-3xl font-bold mono tracking-wider text-indigo-400 overflow-x-auto">0</div>
                </div>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="stdInput('C')" class="btn-nexus p-3.5 rounded-xl text-xs font-bold text-rose-400">C</button>
                    <button onclick="stdInput('CE')"
